name: Deploy Docs

on:
  push:
    branches: [main]

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Consumed by the FlakeHub cache (installed by the composite action);
      # without it the cache silently degrades and the assurance step below
      # rebuilds the pdf-accessibility check from scratch instead of hitting
      # the output CI already built for this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure permissions
        # Unprivileged user namespaces for bubblewrap (zig2nix's zig-hook);
        # see the comment in ci.yml.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build site and PDFs
        uses: ./
        with:
          config_path: config.toml
          redact_mode: "true"
          generate_draft_pdfs: "true"
          # The demo publishes its own audit bundle at /audit/ — the assurance
          # page links it as live evidence. It is also enabled in the demo's
          # config.toml (audit_bundle = true) so local previews serve /audit/;
          # the explicit input documents the consumer-facing switch.
          audit_bundle: "true"

      # Assemble /assurance/: the SBOM, the veraPDF PDF/UA-1 reports (the
      # pdf-accessibility flake check's own $out — a cache hit on this
      # commit, CI already built it), and a fresh axe-core scan as JSON.
      # GitHub artifacts require a login; the site is the anonymous-access
      # surface for this evidence. The a11y scan uses `zola serve` and does
      # not touch the freshly built public/.
      - name: Assemble assurance evidence
        run: |
          mkdir -p public/assurance
          nix develop --command bash -c '
            set -euo pipefail
            tools/sbom.sh > public/assurance/sbom.cdx.json
          '
          cp -L "$(nix build --no-link --print-out-paths .#checks.x86_64-linux.pdf-accessibility)"/verapdf-report.* public/assurance/
          chmod u+w public/assurance/verapdf-report.*
          A11Y_REPORT=public/assurance/a11y-report.json \
            nix develop --command bash -c 'nix shell nixpkgs#chromium nixpkgs#nodejs --command bash tests/a11y/scan.sh'

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: public/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: public/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=policypress --commit-dirty=true
