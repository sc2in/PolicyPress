# The URL your policy site will be published at.
# Used for internal links and the site's canonical URL.
base_url = "https://policies.example.com"

# The policypress theme is fetched automatically by the GitHub Action.
# Do not change this value.
theme = "policypress"

title = "Policies"
description = "Information security and compliance policies."
default_language = "en"
compile_sass = true
minify_html = false
generate_feeds = false
build_search_index = true
generate_sitemap = true
generate_robots_txt = true

[[taxonomies]]
name = "SCF"
feed = false
render = false

[[taxonomies]]
name = "ISO27001"
feed = false
render = false

[[taxonomies]]
name = "TSC2017"
feed = true
render = true

[markdown]
render_emoji = false
smart_punctuation = false
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

[search]
index_format = "elasticlunr_json"

[extra]
# Landing page and navigation
landing_page = true
blog = false
policypress_version = "1"

# Homepage layout: "dashboard" (default) shows a compliance dashboard built from
# your policies (policy count, reviews overdue, framework coverage, review
# status). "marketing" shows a landing page driven by the [extra.frontpage] keys
# below. Internal ISMS sites usually want "dashboard".
homepage_style = "dashboard"

# Optional: brand color for the web theme (buttons, links, accents). Set it to
# the same value as pdf_color so the site and PDFs share one brand color.
# Omit to use the theme's default. Applied at load time - no SCSS recompile.
# brand_color = "#0e90f3"

# PolicyPress configuration
[extra.policypress]
# Your organization's name. Used in PDF headers, footers, and policy text
# wherever the {{ org() }} shortcode appears.
organization = "Example Corp"

# Logo file under static/. Used on the PDF title page and running header.
logo = "logo.png"

# Brand color for PDF title page rules and accents. Any hex color.
pdf_color = "#0e90f3"

# Path to your policies directory, relative to content/.
policy_dir = "policies/"

# Renders a redaction bar over {% redact() %}...{% end %} blocks on the *website*.
# Defaults to true because this starter auto-deploys to public GitHub Pages: with
# it off, redacted content would ship in the site's HTML and search index.
# Web-only (#115); does not itself affect PDFs.
redact_web = true

# Redact the *PDFs* too (mask {% redact() %} spans and add the "__Redacted__"
# filename infix). Defaults to true here for the same reason as redact_web: the
# PDFs are published to the same public Pages site, so leaving them full would
# leak the masked content. Keep this in step with redact_web so the site's PDF
# links resolve (#159). --redact/--no-redact (redact_mode in the action)
# override it.
redact = true

# Set to true to stamp all PDFs with a DRAFT watermark by default.
# Can be overridden per-run with --draft / --no-draft.
show_draft_pdfs = false

# Point at an SCF report page to make inline {{ control(id="…") }} references and
# SCF framework tags link to it. Left unset here, so those references render as
# plain (unlinked) control ids — the shortcode degrades gracefully.
# scf_report_page = "@/reports/scf.md"

# Accept native Markdown footnote references to controls ([^IAC-01]) as an
# alternative to the {{ control(id="IAC-01") }} shortcode (#173). Off by default:
# the shortcode needs no extra build step and works in a plain `zola serve`. With
# this on, the GitHub Action's build synthesises the footnote definitions (via
# `policypress stage-site`) so the references resolve on the site the way they do
# in the PDF. See the "Compliance frameworks" guide.
# control_footnotes = true

# Path to the praxis control-join file (the list of SCF ids an external GRC
# system actively governs). When set, SCF surfaces gain a "praxis" in-spine
# marker and a spine-coverage bar. Regenerate with `nix run .#gen-praxis-join`.
# Left unset here so the starter shows the plain, unmarked baseline.
# praxis_join = "data/praxis-join.json"

[extra.author]
name = "Security Team"
email = "security@example.com"

[extra.menu]
logo = "/logo.png"

[[extra.menu.main]]
title = "Policies"
section = "policies"
url = "/policies/"
weight = 10

[[extra.social]]
name = "github"
url = "https://github.com/example"

# These keys apply only when homepage_style = "marketing". In the default
# "dashboard" layout they are ignored (except features.cards, shown as tiles).
[extra.frontpage]
[extra.frontpage.hero]
title = "Security Policies"
subtitle = "Information security and compliance policies for our organization."

[extra.frontpage.cta]
text = "View Policies"
url = "/policies/"
