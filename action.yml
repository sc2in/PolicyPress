name: PolicyPress
description: Build ISMS policy PDFs and a Zola static site from markdown content.
author: sc2in

branding:
  icon: shield
  color: blue

inputs:
  config_path:
    description: Path to the Zola config.toml file.
    required: false
    default: config.toml
  output_dir:
    description: Output directory for PDFs and reports.
    required: false
    default: public
  draft_mode:
    description: >
      Set to 'true' to stamp PDFs with a DRAFT watermark.
      Set to 'false' (default) to produce clean production PDFs.
    required: false
    default: "false"
  redact_mode:
    description: >
      Redact content inside redaction shortcode tags in the PDFs. 'true' forces
      redaction on; 'false' forces it off; '' (default) inherits the site's
      [extra.policypress] redact setting. Inheriting keeps the PDF links (which
      follow the effective redaction state) in lock-step with config.toml (#159).
    required: false
    default: ""
  generate_draft_pdfs:
    description: >
      Set to 'true' to also generate a second set of PDFs stamped with a DRAFT
      watermark (same redact_mode as the official run). Use this when your site
      config has show_draft_pdfs = true so that draft buttons have valid files
      to link to.
    required: false
    default: "false"
  base_url:
    description: >
      Override the base_url from config.toml (e.g. a Cloudflare Pages preview
      URL). When set, passed to 'zola build --base-url' so that all get_url()
      calls resolve against this origin instead of the production domain.
    required: false
    default: ""
  audit_bundle:
    description: >
      Set to 'true' to also write the machine-readable audit bundle
      (manifest.json with per-PDF sha-256 hashes, revisions.json, coverage
      export) into <output_dir>/audit. Applied only to the official PDF run,
      never the optional draft pass.
    required: false
    default: "false"

outputs:
  pdf_path:
    description: Path to the directory containing generated PDFs.
    value: ${{ steps.build.outputs.pdf_path }}
  site_path:
    description: Path to the directory containing the built static site.
    value: ${{ steps.build.outputs.site_path }}
  report_path:
    description: >-
      Path to the directory containing the generated report PDFs (coverage +
      policy review). Same directory as pdf_path.
    value: ${{ steps.build.outputs.report_path }}
  audit_path:
    description: >-
      Path to the audit-bundle directory (populated when the audit_bundle
      input is 'true').
    value: ${{ steps.build.outputs.audit_path }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3
      with:
        extra-conf: |
          sandbox = false

    - name: Enable unprivileged user namespaces
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which nix's
      # bubblewrap sandbox needs when building policypress from source (the case
      # for a moving-tag pin like @v1 that has no per-ref release binary — without
      # this, the zig2nix toolchain build fails with "bwrap: … Permission denied").
      # Harmless when a prebuilt release binary is downloaded instead; `|| true`
      # makes it a no-op on macOS and on runners where the sysctl is absent.
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Setup Nix cache
      continue-on-error: true
      uses: DeterminateSystems/flakehub-cache-action@9926dde74484ccb2224835b80531de64ed4336ef # v3.21.2

    - name: Resolve theme ref
      id: get-ref
      shell: bash
      # github.action_ref is empty inside a composite action (a long-standing
      # Actions limitation), so derive the pinned ref from the action's own
      # checkout path instead. Remote consumers (uses: sc2in/policypress@vX) are
      # checked out under .../_actions/sc2in/policypress/<ref>, whose basename is
      # the ref (a tag such as v1 or v1.7.0). An in-repo `uses: ./` run has no
      # _actions path, so emit an empty ref and fall back to github.sha below.
      run: |
        case "${GITHUB_ACTION_PATH}" in
          */_actions/*) echo "ref=$(basename "${GITHUB_ACTION_PATH}")" >> "${GITHUB_OUTPUT}" ;;
          *)            echo "ref=" >> "${GITHUB_OUTPUT}" ;;
        esac

    - name: Fetch policypress theme
      uses: actions/checkout@v4
      with:
        repository: sc2in/policypress
        # The pinned ref (v1, v1.7.0, …) resolved from the action path above; empty
        # for in-repo `uses: ./`, where we fall back to the workflow's own commit
        # so previews use the PR's theme, not main's.
        ref: ${{ steps.get-ref.outputs.ref || github.sha }}
        path: themes/policypress

    - name: Install policypress binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "${RUNNER_TEMP}/policypress-bin"

        build_from_flake() {
          # Build the binary from the action's own checkout (pinned at the ref
          # the consumer selected), so the binary always matches the theme code
          # under `uses:`. Used for local `uses: ./` runs and for a branch or SHA
          # pin that matches no release; a moving tag like @v1 resolves to its
          # latest release binary below instead of building here.
          echo "Building policypress from the flake at the pinned ref…"
          out="$(nix build "path:${{ github.action_path }}#policypress-safe" --print-out-paths --no-link)"
          install -m755 "${out}/bin/policypress" "${RUNNER_TEMP}/policypress-bin/policypress"
        }

        REF="${{ steps.get-ref.outputs.ref }}"
        bindir="${RUNNER_TEMP}/policypress-bin"
        if [ -z "${REF}" ]; then
          # In-repo `uses: ./` — no release to match; build from the local checkout.
          build_from_flake
        else
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   BINARY="policypress-x86_64-linux" ;;
            Linux-aarch64)  BINARY="policypress-aarch64-linux" ;;
            Darwin-arm64)   BINARY="policypress-aarch64-macos" ;;
            Darwin-x86_64)  BINARY="policypress-x86_64-macos" ;;
            *)
              echo "Unsupported platform: $(uname -s)-$(uname -m)"
              exit 1
              ;;
          esac

          # Resolve the pinned ref to a release that actually ships assets. A
          # versioned pin (vX.Y.Z) is its own release; a moving line tag (vX or
          # vX.Y) has no release of its own, so resolve it to the newest release
          # sharing that prefix (v1 -> v1.7.0). This keeps `@v1` on a fast prebuilt
          # binary instead of a slow from-source build, and stays on the major
          # line even once a later major exists (^v1\. never matches v10/v2). A
          # branch or SHA pin matches nothing and falls through to a source build.
          if gh release view "${REF}" --repo sc2in/policypress >/dev/null 2>&1; then
            release_tag="${REF}"
          else
            ref_re="${REF//./\\.}"
            release_tag="$(gh release list --repo sc2in/policypress \
                             --exclude-drafts --exclude-pre-releases \
                             --json tagName --jq '.[].tagName' \
                           | grep -E "^${ref_re}\.[0-9]" | sort -V | tail -1 || true)"
          fi

          # Download the resolved release's binary (not "latest") so the pin's
          # major line is honoured.
          if [ -n "${release_tag}" ] \
             && gh release download "${release_tag}" --repo sc2in/policypress \
                  --pattern "${BINARY}" --dir "${bindir}"; then
            echo "Using released binary from ${release_tag} (pinned ${REF})."
            # Verify the download against that release's published checksums. A
            # real release always ships SHA256SUMS.txt (see ci.yml), so a missing
            # checksum file, a missing entry, or a mismatch is fatal — never fall
            # back to trusting an unverified binary.
            if ! gh release download "${release_tag}" --repo sc2in/policypress \
                 --pattern "SHA256SUMS.txt" --dir "${bindir}"; then
              echo "::error::No SHA256SUMS.txt on release ${release_tag}; refusing to run an unverified binary."
              exit 1
            fi
            # Capture the entry explicitly: piping grep into sha256sum would let
            # a no-match (grep exits non-zero) verify empty input and pass.
            expected="$(grep " ${BINARY}\$" "${bindir}/SHA256SUMS.txt" || true)"
            if [ -z "${expected}" ]; then
              echo "::error::SHA256SUMS.txt for ${release_tag} has no entry for ${BINARY}."
              exit 1
            fi
            ( cd "${bindir}" && printf '%s\n' "${expected}" | sha256sum -c - )
            mv "${bindir}/${BINARY}" "${bindir}/policypress"
            chmod +x "${bindir}/policypress"
          else
            echo "::warning::No release binary for ref ${REF}; building from source."
            build_from_flake
          fi
        fi

        echo "${RUNNER_TEMP}/policypress-bin" >> "${GITHUB_PATH}"

    - name: Copy theme shortcodes
      shell: bash
      run: |
        # Zola does not reliably load shortcodes from theme directories when
        # the site also has a templates/ dir. Copy them to the site root so
        # they are always found. -n preserves any site-level overrides.
        mkdir -p templates/shortcodes
        cp -n themes/policypress/templates/shortcodes/*.html templates/shortcodes/

    - name: Copy theme data files
      shell: bash
      run: |
        # Zola's load_data resolves paths from the site root, not the theme.
        # Copy the theme's data files so report templates (SCF, TSC2017, etc.)
        # can find them. -n preserves any site-local overrides.
        if [ -d themes/policypress/data ]; then
          mkdir -p data
          cp -n themes/policypress/data/* data/
        fi

    - name: Copy draft watermark
      shell: bash
      run: |
        # The policypress binary looks for static/draft.png at the site root.
        # Copy it from the theme so draft-mode builds work without the consumer
        # having to vendor the asset. -n preserves any site-local override.
        mkdir -p static
        cp -n themes/policypress/static/draft.png static/ 2>/dev/null || true

    - name: Build site and PDFs
      id: build
      # The ci shell comes from the action's own checkout, so the toolchain
      # (typst, zola, fonts) always matches the action version in use instead
      # of floating on main. Also works for in-repo `uses: ./` workflows.
      shell: nix develop "path:${{ github.action_path }}#ci" --command bash -e {0}
      # Inputs are passed through the environment, never interpolated into the
      # script body: a value like base_url can come from an untrusted source
      # (e.g. a PR preview URL) and `${{ }}` splicing would allow shell
      # injection on the consumer's runner.
      env:
        PP_CONFIG_PATH: ${{ inputs.config_path }}
        PP_OUTPUT_DIR: ${{ inputs.output_dir }}
        PP_BASE_URL: ${{ inputs.base_url }}
        PP_DRAFT_MODE: ${{ inputs.draft_mode }}
        PP_REDACT_MODE: ${{ inputs.redact_mode }}
        PP_GENERATE_DRAFT_PDFS: ${{ inputs.generate_draft_pdfs }}
        PP_AUDIT_BUNDLE: ${{ inputs.audit_bundle }}
      run: |
        set -euo pipefail

        # Stage the site root. When [extra.policypress] control_footnotes is
        # enabled (#173), stage-site writes a disposable copy of the site with
        # synthesised [^CONTROL-ID] footnote definitions appended to content/*.md
        # (the authored tree is never modified); otherwise it prints "." and the
        # build happens in place. Staged into RUNNER_TEMP so the intermediate copy
        # is never uploaded as a site artifact (preserves the #116 redaction
        # property: only public/ is published, and its redaction runs in Zola).
        #
        # Pass the same base_url override zola gets (when set): stage-site prepends
        # its path component to the synthesised footnote links so they resolve
        # under a deployment sub-path, matching the shortcode's get_url links.
        STAGE_ARGS=(-c "${PP_CONFIG_PATH}" -o "${RUNNER_TEMP}/pp-stage")
        if [ -n "${PP_BASE_URL}" ]; then
          STAGE_ARGS+=(--base-url "${PP_BASE_URL}")
        fi
        SITE_ROOT="$(policypress stage-site "${STAGE_ARGS[@]}")"

        # Build the Zola static site from the staged root into the workspace's
        # public/ (where render-diagrams and the deploy expect it). --force
        # because an explicit --output-dir refuses a non-empty target.
        ZOLA_ARGS=()
        if [ -n "${PP_BASE_URL}" ]; then
          ZOLA_ARGS+=(--base-url "${PP_BASE_URL}")
        fi
        zola --root "${SITE_ROOT}" build --output-dir "${PWD}/public" --force "${ZOLA_ARGS[@]}"

        # Render mermaid diagrams to inline SVG in the built site (pozeiden),
        # so the published site ships no client-side mermaid bundle and diagrams
        # render with JavaScript disabled. Operates on the just-built HTML.
        policypress render-diagrams public

        # Build flags. draft_mode is always set explicitly so the action input
        # overrides config.toml. redact_mode inherits config when unset ('') so
        # a config-only consumer can drive PDF redaction from [extra.policypress]
        # redact and keep the PDF links in lock-step (#159); an explicit
        # true/false still overrides.
        ARGS=(-c "${PP_CONFIG_PATH}" -o "${PP_OUTPUT_DIR}/pdfs")
        if [ "${PP_DRAFT_MODE}" = "true" ]; then
          ARGS+=(--draft)
        else
          ARGS+=(--no-draft)
        fi
        if [ "${PP_REDACT_MODE}" = "true" ]; then
          ARGS+=(--redact)
        elif [ "${PP_REDACT_MODE}" = "false" ]; then
          ARGS+=(--no-redact)
        fi
        # Official run only: the draft pass below must never overwrite the
        # bundle with draft-flavoured entries.
        if [ "${PP_AUDIT_BUNDLE}" = "true" ]; then
          ARGS+=(--audit-bundle)
        fi

        # policypress binary is pre-installed from the release; deps are in the ci shell
        policypress "${ARGS[@]}"

        # Optionally generate a second draft-watermarked set of PDFs so that
        # sites with show_draft_pdfs = true have valid files to link to.
        if [ "${PP_GENERATE_DRAFT_PDFS}" = "true" ]; then
          DRAFT_ARGS=(-c "${PP_CONFIG_PATH}" -o "${PP_OUTPUT_DIR}/pdfs" --draft)
          if [ "${PP_REDACT_MODE}" = "true" ]; then
            DRAFT_ARGS+=(--redact)
          elif [ "${PP_REDACT_MODE}" = "false" ]; then
            DRAFT_ARGS+=(--no-redact)
          fi
          policypress "${DRAFT_ARGS[@]}"
        fi

        echo "pdf_path=${PP_OUTPUT_DIR}/pdfs"    >> "$GITHUB_OUTPUT"
        echo "site_path=public"                  >> "$GITHUB_OUTPUT"
        echo "report_path=${PP_OUTPUT_DIR}/pdfs"  >> "$GITHUB_OUTPUT"
        echo "audit_path=${PP_OUTPUT_DIR}/audit"  >> "$GITHUB_OUTPUT"
