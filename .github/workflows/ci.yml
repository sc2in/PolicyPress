name: CI

on:
  push:
    branches: ["**"]
    tags: ["v?[0-9]+.[0-9]+.[0-9]+*"]
    paths-ignore:
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/deploy-docs.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Only the tag-gated `release` job below opts into
# `contents: write`; the build/test job never needs it.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Run both OSes on PRs to main and on release tags; ubuntu-only otherwise.
        os: >-
          ${{
            (github.ref_type == 'tag' || github.event_name == 'pull_request')
            && fromJson('["ubuntu-latest", "macos-latest"]')
            || fromJson('["ubuntu-latest"]')
          }}
    runs-on: ${{ matrix.os }}
    permissions:
      # id-token is consumed by the FlakeHub cache on every run. contents stays
      # read-only: build/test must never be able to push commits or move tags.
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the release-tag CHANGELOG guard can diff
          # against the previous tag.
          fetch-depth: 0

      # Authoritative backstop for the local pre-push hook (.githooks/pre-push):
      # a release tag must include a CHANGELOG.md change since the previous tag.
      # Cannot be bypassed with `git push --no-verify`.
      - name: Require CHANGELOG update for release tag
        if: ${{ github.ref_type == 'tag' && matrix.os == 'ubuntu-latest' }}
        run: |
          tag="${{ github.ref_name }}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "No previous tag; skipping CHANGELOG check."
            exit 0
          fi
          if git diff --quiet "$prev" "$tag" -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no changes between $prev and $tag. Update the changelog (e.g. 'nix run .#bump') before releasing."
            exit 1
          fi
          echo "CHANGELOG.md updated since $prev ✓"

      # Releases are cut from the tag exactly as pushed (CI no longer stamps and
      # force-moves the tag). Guard that the maintainer stamped the version
      # before tagging so the release binary can't disagree with the tag.
      - name: Verify version is stamped to match the release tag
        if: ${{ github.ref_type == 'tag' && matrix.os == 'ubuntu-latest' }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          zon_version="$(grep -oP '\.version = "\K[^"]+' build.zig.zon | head -1)"
          toml_version="$(grep -oP '^version = "\K[^"]+' config.toml | head -1)"
          if [ "$zon_version" != "$version" ] || [ "$toml_version" != "$version" ]; then
            echo "::error::Version drift: tag=$version, build.zig.zon=$zon_version, config.toml=$toml_version. Run 'nix run .#bump ${version}' and commit before tagging."
            exit 1
          fi
          echo "Version $version is stamped in build.zig.zon and config.toml ✓"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@9926dde74484ccb2224835b80531de64ed4336ef # v3.21.2
        with:
          use-gha-cache: "enabled"
          flakehub-flake-name: "sc2in/PolicyPress"

      - name: Install omnix
        run: nix --accept-flake-config profile add nixpkgs#omnix

      - name: Configure permissions
        # Enable unprivileged user namespaces, required by bubblewrap: zig2nix's
        # zig-hook runs the compiler inside bwrap for network isolation, so any
        # from-source build of zig2nix tooling fails without this on Ubuntu
        # 24.04 runners ("bwrap: setting up uid map: Permission denied").
        # The sysctl does not exist on macOS so || true makes it safe.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run CI
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Full test suite on macOS: the typst engine renders mermaid
            # in-process (pozeiden), so the old mermaid-filter/Chromium
            # limitation is gone. Use just the pinned Zig (prebuilt) plus
            # typst rather than the full devShell: zig2nix's source-built
            # inputs currently pull glibc into the aarch64-darwin closure,
            # which nix refuses to evaluate.
            nix shell .#zig nixpkgs#typst --command zig build test
          else
            om ci run
          fi

      # End-to-end guard for the redaction feature: build the demo site and
      # redacted PDFs and assert no {% redact() %} content survives into the
      # published site (HTML, search index, feeds) or the PDF output dir.
      - name: Redaction leak check
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: nix develop --command bash -e {0}
        run: |
          zig build
          bash tests/redaction-leak-check.sh

      # Web accessibility gate: serve the site and run axe-core (vendored) over a
      # representative page of every template in light and dark mode; fail on any
      # WCAG A/AA violation. chromium + node come from nixpkgs (no npm).
      - name: Accessibility scan (axe-core)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: nix develop --command bash -e {0}
        run: |
          nix shell nixpkgs#chromium nixpkgs#nodejs --command bash tests/a11y/scan.sh

      - name: Collect artifacts
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main') }}
        run: |
          mkdir -p artifacts
          nix build --no-link --print-out-paths .# | xargs -I{} cp -rL {}/ artifacts/

      - name: Upload artifacts
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main') }}
        uses: actions/upload-artifact@v4
        with:
          name: policypress
          path: artifacts/
          retention-days: 7

  # Release job: runs only on release tags and holds the write scope the build/
  # test job deliberately lacks. The pushed tag is authoritative — the version
  # must already be stamped (`nix run .#bump <ver>` before tagging), so nothing
  # here rewrites or force-moves vX.Y.Z after the publish triggers have fired.
  release:
    needs: [ci]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "write"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@9926dde74484ccb2224835b80531de64ed4336ef # v3.21.2
        with:
          use-gha-cache: "enabled"
          flakehub-flake-name: "sc2in/PolicyPress"

      - name: Configure permissions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build release binaries
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows; do
              echo "▸ Building $target..."
              zig build -Doptimize=ReleaseSafe -Dtarget="$target"
              ext=""
              [[ "$target" == *windows* ]] && ext=".exe"
              cp "zig-out/bin/policypress${ext}" "policypress-${target}${ext}"
            done
            # Publish checksums so the composite action can verify the binary it
            # downloads matches the one built here for this exact tag.
            sha256sum policypress-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            policypress-*
            SHA256SUMS.txt
          generate_release_notes: true

      # The floating major tag (e.g. v1) is a convenience alias consumers pin to.
      # Moving it is safe: `v1` does not match the trigger pattern
      # `v?[0-9]+.[0-9]+.[0-9]+*`, so it never re-fires CI or the FlakeHub publish.
      - name: Update floating major version tag
        run: |
          major=$(echo "${{ github.ref_name }}" | grep -oP '^v?\d+')
          git tag -f "$major"
          git push --force origin "$major"
