name: Build Policies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rebuild so time-based "Review overdue" badges (rendered from the
  # build-time date) stay current on quiet repos that rarely push. Runs on the
  # default branch, so the `github.ref == 'refs/heads/main'` deploy gating below
  # still holds. Note: GitHub suspends scheduled runs on repos with no activity
  # for 60 days — a manual run (or any push) re-arms the schedule.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      draft:
        description: "Stamp PDFs with DRAFT watermark"
        required: false
        default: "false"
      redact:
        description: "Redact content inside redaction tags"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    # Build only reads the repo and uploads artifacts; Pages/OIDC write is held
    # solely by the `deploy` job below, which is the only step that publishes.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build policies
        uses: sc2in/policypress@v1
        with:
          config_path: config.toml
          draft_mode: ${{ github.event.inputs.draft || 'false' }}
          redact_mode: ${{ github.event.inputs.redact || 'true' }}

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: policies
          path: public/pdfs/
          retention-days: 90

      - name: Pages visibility reminder
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::notice title=Publishing to GitHub Pages::This run publishes your policy site (and uploads PDFs as an artifact). GitHub Pages is public by default — see the 'GitHub Pages Setup' warning in README.md before relying on it for internal-only policies."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
