name: CI

on:
  # Feature branches are covered by the pull_request trigger below; pushing to
  # a branch that also has an open PR used to run CI twice (the push event and
  # the pull_request event live in different concurrency groups). Restricting
  # push to main + tags removes that duplicate run with no loss of coverage.
  push:
    branches: ["main"]
    tags: ["v?[0-9]+.[0-9]+.[0-9]+*"]
    paths-ignore:
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/workflows/deploy-docs.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Only the tag-gated `release` job below opts into
# `contents: write`; the build/test job never needs it.
permissions:
  contents: read

jobs:
  # Decide the OS matrix once, cheaply, on Ubuntu. macOS runners are ~10x the
  # cost of Linux, so we only pay for them where they add coverage: release
  # tags (always) and pull requests that touch something other than docs. A
  # docs-only PR (*.md / docs/) runs Ubuntu-only. main-branch pushes stay
  # Ubuntu-only, as before.
  changes:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.decide.outputs.os }}
      # Release cross-compilation targets, read from the single source of truth
      # that flake.nix's apps.release also consumes. Only used on tags.
      targets: ${{ steps.decide.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          macos=false
          if [ "$REF_TYPE" = tag ]; then
            macos=true
          elif [ "$EVENT" = pull_request ]; then
            # A non-docs file in the diff means macOS coverage is worth it.
            # grep -qv exits 0 as soon as a line does NOT match the docs pattern.
            if git diff --name-only "$BASE_SHA" HEAD | grep -qvE '(\.md$|^docs/)'; then
              macos=true
            fi
          fi
          if [ "$macos" = true ]; then
            echo 'os=["ubuntu-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
          echo "targets=$(jq -c '.targets' release-targets.json)" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      # id-token is consumed by the FlakeHub cache on every run. contents stays
      # read-only: build/test must never be able to push commits or move tags.
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the release-tag CHANGELOG guard can diff
          # against the previous tag.
          fetch-depth: 0

      # Release-tag guards, before the nix install for fail-fast (they need
      # only git + grep): CHANGELOG.md changed since the previous tag, and the
      # version stamped in build.zig.zon/config.toml matches the tag. The logic
      # lives in tools/check-release.sh so it runs identically here, locally
      # (bash tools/check-release.sh <tag>), and via `nix run .#check-release`.
      # This is the authoritative backstop for the local .githooks/pre-push
      # CHANGELOG check (which `git push --no-verify` can skip).
      - name: Release-tag guards (CHANGELOG + version stamp)
        if: ${{ github.ref_type == 'tag' && matrix.os == 'ubuntu-latest' }}
        run: bash tools/check-release.sh "${{ github.ref_name }}"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@9926dde74484ccb2224835b80531de64ed4336ef # v3.21.2
        with:
          use-gha-cache: "enabled"
          flakehub-flake-name: "sc2in/PolicyPress"

      - name: Install omnix
        # Only the Ubuntu path runs `om ci run`; the macOS path uses
        # `nix shell .#zig …` directly, so omnix is dead weight there.
        if: ${{ runner.os == 'Linux' }}
        run: nix --accept-flake-config profile add nixpkgs#omnix

      - name: Configure permissions
        # Enable unprivileged user namespaces, required by bubblewrap: zig2nix's
        # zig-hook runs the compiler inside bwrap for network isolation, so any
        # from-source build of zig2nix tooling fails without this on Ubuntu
        # 24.04 runners ("bwrap: setting up uid map: Permission denied").
        # The sysctl does not exist on macOS so || true makes it safe.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run CI
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Full test suite on macOS: the typst engine renders mermaid
            # in-process (pozeiden), so the old mermaid-filter/Chromium
            # limitation is gone. Use just the pinned Zig (prebuilt) plus
            # typst rather than the full devShell: zig2nix's source-built
            # inputs currently pull glibc into the aarch64-darwin closure,
            # which nix refuses to evaluate.
            nix shell .#zig nixpkgs#typst --command zig build test
          else
            om ci run
          fi

      # The redaction leak check runs as the `redaction-leak` flake check via
      # `om ci run` above, so it is not repeated as a separate step here.

      # Web accessibility gate: serve the site and run axe-core (vendored) over a
      # representative page of every template in light and dark mode; fail on any
      # WCAG A/AA violation. The `a11y-scan` flake app pins chromium + node +
      # zola (no floating nixpkgs# reference) and is runnable locally too.
      - name: Accessibility scan (axe-core)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          # Structured results for the attestation-evidence artifact below.
          A11Y_REPORT: evidence/a11y-report.json
        run: nix run .#a11y-scan

      # Self-attestation evidence: SBOM (CycloneDX from the Zig lock file),
      # per-check records with logs, the veraPDF PDF/UA-1 reports (the
      # pdf-accessibility check's own $out — a cache hit, just built above),
      # and the axe-core JSON written by the scan step.
      #
      # Runs on PRs to main as well as on main-branch pushes and tags: this
      # generation is itself a step that can fail (a broken sbom.sh, a
      # check-evidence eval error, a veraPDF report that won't produce), so
      # exercising it on the PR keeps a breakage off main, and the uploaded
      # artifact lets a reviewer examine the SBOM/reports before merge.
      - name: Collect attestation evidence
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
        run: |
          mkdir -p evidence
          nix run .#sbom > evidence/sbom.cdx.json
          nix run .#check-evidence -- evidence
          mkdir -p evidence/verapdf
          cp -rL "$(nix build --no-link --print-out-paths .#checks.x86_64-linux.pdf-accessibility)"/. evidence/verapdf/

      - name: Upload attestation evidence
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
        uses: actions/upload-artifact@v4
        with:
          name: attestation-evidence
          path: evidence/
          retention-days: 90

      - name: Collect artifacts
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main') }}
        run: |
          mkdir -p artifacts
          nix build --no-link --print-out-paths .# | xargs -I{} cp -rL {}/ artifacts/

      - name: Upload artifacts
        if: ${{ success() && matrix.os == 'ubuntu-latest' && (github.ref_type == 'tag' || github.ref_name == 'main') }}
        uses: actions/upload-artifact@v4
        with:
          name: policypress
          path: artifacts/
          retention-days: 7

  # Release build: runs only on tags, once per target, in parallel. Each leg
  # cross-compiles one target and uploads its binary as an artifact for the
  # publish job to gather. The target list comes from release-targets.json (via
  # the `changes` job), the same file flake.nix's apps.release reads, so a local
  # `nix run .#release` and the shipped GitHub Release can never drift apart.
  # These legs hold no write scope — only the publish job below does.
  release-build:
    needs: [changes, ci]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJson(needs.changes.outputs.targets) }}
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@9926dde74484ccb2224835b80531de64ed4336ef # v3.21.2
        with:
          use-gha-cache: "enabled"
          flakehub-flake-name: "sc2in/PolicyPress"

      - name: Configure permissions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build ${{ matrix.target }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            target="${{ matrix.target }}"
            echo "▸ Building $target..."
            zig build -Doptimize=ReleaseSafe -Dtarget="$target"
            ext=""
            [[ "$target" == *windows* ]] && ext=".exe"
            cp "zig-out/bin/policypress${ext}" "policypress-${target}${ext}"
          '

      - name: Upload ${{ matrix.target }} binary
        uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.target }}
          path: policypress-${{ matrix.target }}*
          retention-days: 1

  # Release publish: gathers the per-target binaries, assembles checksums + the
  # SBOM (reusing the one the ci job already generated, not regenerating it),
  # cuts the GitHub Release, and publishes to FlakeHub. This is the only job
  # with write scope, and it runs strictly after ci + every release-build leg —
  # so a failing test or a broken cross-compile blocks the FlakeHub publish too
  # (which used to fire in its own workflow regardless of CI).
  #
  # The pushed tag is authoritative — the version must already be stamped
  # (`nix run .#bump <ver>` before tagging), so nothing here rewrites vX.Y.Z.
  release-publish:
    needs: [release-build]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: "write"
      contents: "write"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          path: dist
          merge-multiple: true

      - name: Download attestation evidence (for the SBOM)
        uses: actions/download-artifact@v4
        with:
          name: attestation-evidence
          path: evidence

      - name: Assemble release assets
        run: |
          set -euo pipefail
          # Reuse the SBOM the ci job already built for this exact commit
          # instead of regenerating it here (CycloneDX 1.5, from the Zig lock).
          cp evidence/sbom.cdx.json dist/sbom.cdx.json
          cd dist
          # Checksums let the composite action verify the binary it downloads
          # matches the one built here for this exact tag.
          sha256sum policypress-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/policypress-*
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
          generate_release_notes: true

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Publish to FlakeHub
        uses: DeterminateSystems/flakehub-push@71f57208810a5d299fc6545350981de98fdbc860 # v6
        with:
          visibility: "public"
          name: "sc2in/PolicyPress"
          tag: "${{ github.ref_name }}"
          include-output-paths: false

      # The floating major tag (e.g. v1) is a convenience alias consumers pin to.
      # Moving it is safe: `v1` does not match the trigger pattern
      # `v?[0-9]+.[0-9]+.[0-9]+*`, so it never re-fires CI or the FlakeHub publish.
      - name: Update floating major version tag
        run: |
          major=$(echo "${{ github.ref_name }}" | grep -oP '^v?\d+')
          git tag -f "$major"
          git push --force origin "$major"
